# Effort: reasoning_effort = none|minimal|low|medium|high|max; thinking is off unless reasoning_effort asks for it.
# Pricing: https://www.runwally.com/pricing
# Limits, modalities and reasoning levels: GET https://inference.runanywhere.ai/v1/models
schema = 2
base_model = "deepseek/deepseek-v4-flash-0731"

[capabilities]
reasoning = { supported = true, default = { type = "effort", value = "none" }, effort = ["none", "minimal", "low", "medium", "high", "max"] }
structured_output = true
cache = { implicit = true }

[limit]
context = 1_048_576
output = 65_536

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.44
cache = { read = 0.014 }

[cost.text.output]
price = 1.32
