# Effort: reasoning_effort = low|medium|high|xhigh|max. Thinking cannot be turned off; none is rejected.
# Pricing: https://www.runwally.com/pricing
# Limits, modalities and reasoning levels: GET https://inference.runanywhere.ai/v1/models
schema = 2
base_model = "minimax/MiniMax-M3"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }
structured_output = true
cache = { implicit = true }

[limit]
context = 524_287
output = 131_072

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.33
cache = { read = 0.066 }

[cost.text.output]
price = 1.32
