# Effort: reasoning_effort = none|low|medium|high|max (default high); none turns thinking off.
# Images: PNG, JPEG and WebP (GIF is rejected with a 400).
# Pricing: https://www.runwally.com/pricing
# Limits, modalities and reasoning levels: GET https://inference.runanywhere.ai/v1/models
schema = 2
base_model = "deepseek/deepseek-v4.1-flash"
name = "DeepSeek V4.1 Flash Fast"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/webp"]
output = ["text"]

[capabilities]
reasoning = { supported = true, default = { type = "effort", value = "high" }, effort = ["none", "low", "medium", "high", "max"] }
structured_output = true
cache = { implicit = true }

[limit]
context = 1_048_576
output = 65_536

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.6
cache = { read = 0.014 }

[cost.text.output]
price = 2.4
